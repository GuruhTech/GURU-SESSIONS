<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PANTHERR | Status</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #020810;
      --cyan: #00C9FF;
      --cyan-dim: rgba(0,201,255,0.07);
      --cyan-border: rgba(0,201,255,0.18);
      --cyan-glow: rgba(0,201,255,0.35);
      --teal: #0891B2;
      --gold: #F59E0B;
      --gold-dim: rgba(245,158,11,0.10);
      --gold-border: rgba(245,158,11,0.22);
      --card: #06101A;
      --text: #E0F7FF;
      --muted: rgba(224,247,255,0.38);
      --green: #34D399;
      --red: #F87171;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; padding: 2rem 1rem; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse at 70% 0%, rgba(0,201,255,0.09) 0%, transparent 55%),
        radial-gradient(ellipse at 5% 100%, rgba(245,158,11,0.05) 0%, transparent 45%);
    }
    .page { max-width: 720px; margin: 0 auto; position: relative; z-index: 1; }

    header { display: flex; align-items: center; gap: 1rem; margin-bottom: 2.5rem; }
    .logo {
      width: 44px; height: 44px; border-radius: 12px;
      background: linear-gradient(135deg, var(--cyan), var(--teal));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; color: #020810; font-weight: 900;
    }
    header h1 { font-size: 1.4rem; font-weight: 900; letter-spacing: 0.03em; }
    header h1 span { background: linear-gradient(135deg, var(--cyan), var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .subtitle { font-size: 0.72rem; color: var(--muted); font-family: 'JetBrains Mono', monospace; margin-top: 2px; }
    .refresh-btn {
      margin-left: auto; padding: 0.45rem 1rem; border-radius: 8px;
      background: var(--cyan-dim); border: 1px solid var(--cyan-border);
      color: var(--cyan); font-family: 'Outfit', sans-serif;
      font-size: 0.82rem; font-weight: 700; cursor: pointer; transition: background 0.2s;
    }
    .refresh-btn:hover { background: rgba(0,201,255,0.14); }

    .status-banner {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 1rem 1.25rem; border-radius: 14px;
      border: 1px solid var(--cyan-border);
      background: var(--cyan-dim); margin-bottom: 1.5rem;
      position: relative; overflow: hidden;
    }
    .status-banner::before {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), var(--gold), transparent);
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 2s infinite; flex-shrink: 0; }
    .dot.error { background: var(--red); box-shadow: 0 0 8px var(--red); animation: none; }
    .dot.loading { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }
    .status-label { font-weight: 800; font-size: 1rem; letter-spacing: 0.03em; }
    .status-ts { margin-left: auto; font-size: 0.72rem; color: var(--muted); font-family: 'JetBrains Mono', monospace; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
    @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }

    .card {
      background: var(--card); border: 1px solid var(--cyan-border);
      border-radius: 16px; padding: 1.25rem 1.4rem; position: relative; overflow: hidden;
    }
    .card::after {
      content: ''; position: absolute; bottom: 0; right: 0;
      width: 40px; height: 40px;
      background: linear-gradient(135deg, transparent 50%, rgba(0,201,255,0.06) 50%);
    }
    .card-label {
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.12em;
      color: var(--muted); text-transform: uppercase; margin-bottom: 0.6rem;
      font-family: 'JetBrains Mono', monospace;
    }
    .card-value { font-size: 1.55rem; font-weight: 900; color: var(--text); font-family: 'JetBrains Mono', monospace; }
    .card-value.sm { font-size: 1.05rem; }
    .card-sub { font-size: 0.72rem; color: var(--muted); margin-top: 0.35rem; }

    .tag { display: inline-block; padding: 0.2rem 0.65rem; border-radius: 20px; font-size: 0.7rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
    .tag-green { background: rgba(52,211,153,0.1); color: var(--green); border: 1px solid rgba(52,211,153,0.25); }
    .tag-cyan { background: var(--cyan-dim); color: var(--cyan); border: 1px solid var(--cyan-border); }
    .tag-gold { background: var(--gold-dim); color: var(--gold); border: 1px solid var(--gold-border); }
    .tag-red { background: rgba(248,113,113,0.1); color: var(--red); border: 1px solid rgba(248,113,113,0.25); }

    .bar-wrap { background: rgba(255,255,255,0.06); border-radius: 6px; height: 6px; margin-top: 0.6rem; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--cyan), var(--gold)); transition: width 0.5s; }
    .card-full { grid-column: 1 / -1; }

    .error-box { background: rgba(248,113,113,0.07); border: 1px solid rgba(248,113,113,0.2); border-radius: 14px; padding: 1.25rem 1.4rem; font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; color: var(--red); }

    footer { text-align: center; margin-top: 2rem; font-size: 0.7rem; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
    footer a { color: var(--cyan); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="page">
  <header>
    <div class="logo">⚡</div>
    <div>
      <h1>BLACK<span>PANTHER</span></h1>
      <div class="subtitle">SYSTEM_STATUS · WAKANDA_PROTOCOL</div>
    </div>
    <button class="refresh-btn" onclick="load()">↻ Refresh</button>
  </header>

  <div id="banner" class="status-banner">
    <div class="dot loading" id="dot"></div>
    <span class="status-label" id="status-label">Connecting...</span>
    <span class="status-ts" id="status-ts"></span>
  </div>

  <div id="content"></div>

  <footer>PANTHERR Session &nbsp;·&nbsp; <a href="/">Home</a> &nbsp;·&nbsp; <a href="/pair">Pair</a> &nbsp;·&nbsp; <a href="/qr">QR</a></footer>
</div>

<script>
async function load() {
  const dot = document.getElementById('dot');
  const label = document.getElementById('status-label');
  const ts = document.getElementById('status-ts');
  const content = document.getElementById('content');

  dot.className = 'dot loading';
  label.textContent = 'Fetching...';

  try {
    const res = await fetch('/health');
    const d = await res.json();

    dot.className = d.success ? 'dot' : 'dot error';
    label.textContent = d.success ? 'ALL SYSTEMS OPERATIONAL' : 'DEGRADED';
    ts.textContent = new Date(d.timestamp).toLocaleTimeString();

    const memPct = d.system?.memory
      ? Math.round((d.system.memory.used_mb / d.system.memory.total_mb) * 100)
      : 0;

    const storageConfigured = d.storage?.configured;
    const storageType = (d.storage?.type || 'unknown').toUpperCase();
    const envTag = (d.environment || 'local').toUpperCase();

    content.innerHTML = `
      <div class="grid">
        <div class="card">
          <div class="card-label">Service</div>
          <div class="card-value sm">${d.service || 'PANTHERR'}</div>
          <div class="card-sub" style="margin-top:0.5rem">
            <span class="tag tag-cyan">${envTag}</span>
          </div>
        </div>

        <div class="card">
          <div class="card-label">Storage</div>
          <div class="card-value sm">${storageType}</div>
          <div class="card-sub" style="margin-top:0.5rem">
            <span class="tag ${storageConfigured ? 'tag-green' : 'tag-red'}">
              ${storageConfigured ? 'CONNECTED' : 'NOT CONFIGURED'}
            </span>
          </div>
        </div>

        <div class="card">
          <div class="card-label">Active Sessions</div>
          <div class="card-value">${d.sessions?.active ?? 0}</div>
          <div class="card-sub">pairing in progress</div>
        </div>

        <div class="card">
          <div class="card-label">Uptime</div>
          <div class="card-value sm">${d.system?.uptime || '—'}</div>
          <div class="card-sub">Node ${d.system?.node || ''}</div>
        </div>

        <div class="card card-full">
          <div class="card-label">Memory Usage</div>
          <div style="display:flex;justify-content:space-between;align-items:baseline">
            <div class="card-value sm">${d.system?.memory?.used_mb ?? '—'} MB used</div>
            <div class="card-sub">${d.system?.memory?.rss_mb ?? '—'} MB RSS &nbsp;·&nbsp; ${d.system?.memory?.total_mb ?? '—'} MB heap</div>
          </div>
          <div class="bar-wrap"><div class="bar-fill" style="width:${memPct}%"></div></div>
          <div class="card-sub" style="margin-top:0.4rem">${memPct}% heap used</div>
        </div>
      </div>`;
  } catch (e) {
    dot.className = 'dot error';
    label.textContent = 'UNREACHABLE';
    ts.textContent = new Date().toLocaleTimeString();
    content.innerHTML = '<div class="error-box">Failed to reach /health — ' + e.message + '</div>';
  }
}
load();
setInterval(load, 30000);
</script>
</body>
</html>
